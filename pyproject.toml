[project]
name = "rag-course"
version = "0.1.0"
description = "rag-course project (Python 3.8)"
readme = "README.md"
authors = [
    { name = "leyodr9000", email = "leyodr9000@gitee.com" }
]
requires-python = ">=3.8,<3.9"
dependencies = [
    "openai>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
rag-course = "rag_course:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
