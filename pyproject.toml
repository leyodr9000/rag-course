[project]
name = "rag-course"
version = "0.1.0"
description = "rag-course project (Python 3.12)"
readme = "README.md"
authors = [
    { name = "leyodr9000", email = "leyodr9000@gitee.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.27.6",
    "langchain>=0.0.27",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "numpy>=2.5.3",
    "openai>=2.2.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.64.0",
]

[project.scripts]
rag-course = "rag_course:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
